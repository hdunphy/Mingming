<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mingming — deck browser</title>
<!--
  THE DECK BROWSER. Generated by `npm run decks` (src/debug/balance/runDeckBrowser.ts).

  Standalone on purpose: no server, no build, no `npm run dev`. Double-click the file.
  Everything structural is read from the live registry at generation time; the win rates are
  borrowed from docs/balance/deck_report.json and badged STALE when that report was measured
  against a different registry hash. See src/debug/balance/deckBrowser.ts for the argument.

  The visual language is the one ticket 62/63/65's mockups ratified (runShell.css), so a deck
  reads here the way it reads in the game.
-->
<style>
:root {
  --bg: #0c0e12; --panel: #0f131a; --panel2: #10151d; --line: #232a35; --line2: #2c3745;
  --text: #dfe4ea; --dim: #8fa0b3; --dimmer: #5f6b7a; --faint: #4d5866;
  --gold: #ffd479; --green: #7fd6a4; --blue: #3d9be0; --red: #e05d43;
  --Fire:#e05d43; --Water:#3d9be0; --Nature:#43b45f; --Earth:#b08040;
  --Air:#8fc7f5; --Ice:#7fd6ff; --Light:#e8d27a; --Dark:#9a6fd0; --None:#9aa3ad;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(1200px 500px at 60% -10%, #16202c 0%, var(--bg) 60%) fixed;
  color: var(--text); font-family:'Segoe UI', system-ui, sans-serif; height:100vh; overflow:hidden;
}
.app { display:flex; flex-direction:column; height:100vh; }

/* --- top bar --- */
.top { height:50px; display:flex; align-items:center; gap:14px; padding:0 18px;
  border-bottom:1px solid var(--line); background:#10141b; flex:none; }
.title { font-size:14px; letter-spacing:2px; color:#9fb4c8; font-weight:600; }
.ctx { font-size:11.5px; color:var(--dimmer); letter-spacing:1px; }
.spacer { flex:1; }
.btn { border:1px solid #3a4a5e; background:#1a2330; border-radius:3px; padding:6px 14px;
  font-size:12px; letter-spacing:1px; color:var(--text); cursor:pointer; font-family:inherit; }
.btn.on { background:#245a8c; border-color:#3d7ab5; }
.search { border:1px solid var(--line2); border-radius:12px; padding:4px 12px; font-size:11.5px;
  color:var(--text); background:#12171f; width:190px; font-family:inherit; }

/* --- staleness banner --- */
.banner { padding:8px 18px; font-size:11.5px; border-bottom:1px solid var(--line); flex:none; line-height:1.5; }
.banner.stale { background:#241c0e; border-bottom-color:#8a6d3b; color:var(--gold); }
.banner.fresh { background:#0f1a14; border-bottom-color:#2c6e49; color:var(--green); }
.banner code { background:#0006; padding:1px 5px; border-radius:3px; }

/* --- layout --- */
.body { flex:1; display:flex; min-height:0; }
.rail { width:236px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:10px 8px; }
.main { flex:1; overflow-y:auto; padding:14px 18px 40px; min-width:0; }
.main.split { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

/* --- the rail --- */
.rail-group { font-size:9.5px; letter-spacing:2px; color:var(--dimmer); margin:12px 6px 5px; }
.rail-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  border:1px solid transparent; border-radius:5px; background:none; color:inherit;
  padding:5px 7px; cursor:pointer; font-family:inherit; margin-bottom:2px; }
.rail-item:hover { background:#141a23; }
.rail-item.sel { border-color:var(--el); background:#151c26; }
.rail-item.pin { border-color:var(--gold); }
.dot { width:26px; height:26px; border-radius:5px; flex:none; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:12px; color:#fff;
  background:linear-gradient(135deg, var(--el), #0c0e12 165%); }
.rail-txt { display:flex; flex-direction:column; min-width:0; }
.rail-nm { font-size:12px; font-weight:700; white-space:nowrap; }
.rail-os { font-size:9px; color:var(--dim); letter-spacing:1px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.rail-wr { margin-left:auto; font-size:10.5px; color:var(--green); font-variant-numeric:tabular-nums; }
.rail-wr.stale { color:var(--faint); }
.untuned .rail-nm { color:var(--dim); }

/* --- deck panel --- */
.deck { border:1px solid var(--line); border-radius:7px; background:var(--panel); padding:14px 16px; }
.deck-head { display:flex; align-items:center; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
.bigdot { width:44px; height:44px; border-radius:7px; flex:none; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:20px; color:#fff;
  background:linear-gradient(135deg, var(--el), #0c0e12 165%); }
h1 { font-size:19px; font-weight:700; letter-spacing:.5px; }
.sub { font-size:11px; color:var(--dim); letter-spacing:1px; }
.tag { font-size:9px; letter-spacing:1.5px; padding:2px 7px; border-radius:3px;
  border:1px solid var(--line2); color:var(--dim); }
.tag.el { color:var(--el); border-color:var(--el); }
.tag.warn { color:var(--gold); border-color:#8a6d3b; }
.statline { display:flex; gap:14px; font-size:11px; color:var(--dim); margin:8px 0 12px;
  flex-wrap:wrap; font-variant-numeric:tabular-nums; }
.statline b { color:var(--text); font-weight:600; }

h2 { font-size:10px; letter-spacing:2px; color:#9fb4c8; margin:16px 0 7px; font-weight:600; }
h2:first-of-type { margin-top:6px; }

.os { border:1px solid #2c4a6e; border-left:3px solid var(--blue); border-radius:5px;
  background:#101822; padding:10px 12px; }
.os-nm { font-size:13px; font-weight:700; letter-spacing:1px; color:#9fc7ef; margin-bottom:3px; }
.os-desc { font-size:12px; color:#c3ccd6; line-height:1.5; }
.archetype { font-size:11.5px; color:var(--dim); line-height:1.5; margin-top:8px;
  padding-top:8px; border-top:1px dashed var(--line); font-style:italic; }

/* --- cards --- */
.cards { display:flex; flex-direction:column; gap:4px; }
.card { display:flex; align-items:flex-start; gap:9px; border:1px solid #2b3441;
  border-left:4px solid var(--el); border-radius:4px; background:#131820; padding:7px 9px; }
.card.payoff { border-color:var(--el); background:#171d26; box-shadow:inset 0 0 0 1px #ffffff0d; }
.gem { width:19px; height:19px; border-radius:50%; flex:none; background:var(--el); color:#0c0e12;
  font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.card-body { flex:1; min-width:0; }
.card-top { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
.card-nm { font-size:12.5px; font-weight:700; }
.xn { color:var(--gold); font-weight:800; font-size:11px; }
.role { font-size:8.5px; letter-spacing:1.5px; padding:1px 5px; border-radius:2px; }
.role.payoff { background:#5b2320; color:#ff9d8f; }
.role.enabler { background:#1e3a52; color:#8fc7f5; }
.type { font-size:8.5px; letter-spacing:1px; color:var(--dimmer); }
.card-desc { font-size:11px; color:#aeb9c6; line-height:1.4; margin-top:2px; }
.card-tel { font-size:9.5px; color:var(--dimmer); margin-top:3px; font-variant-numeric:tabular-nums; }
.card-tel.stale { color:var(--faint); font-style:italic; }
.card-tel .bad { color:#c98b7a; }

/* --- curve ---
   The bar's height is a percentage, so it needs a parent with a DEFINITE height to resolve
   against. Hence the explicit .track: putting the numbers and the axis labels in the same flex
   column as the bar made the percentage resolve against a box the labels were also shrinking,
   and every bar came out 2px tall regardless of its value. */
.curve { display:flex; align-items:flex-end; gap:5px; }
.bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.bar span { font-size:9px; color:var(--dimmer); font-variant-numeric:tabular-nums; }
.bar .track { height:44px; width:100%; display:flex; align-items:flex-end; }
.bar i { width:100%; flex:none; background:linear-gradient(180deg, var(--el), #0c0e1266);
  border-radius:2px 2px 0 0; min-height:2px; display:block; }
.bar.zero i { background:#1b212b; }

/* --- summary grid --- */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px,1fr)); gap:7px; }
.cell { border:1px solid var(--line); border-radius:5px; background:var(--panel2); padding:7px 9px; }
.cell .v { font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
.cell .k { font-size:8.5px; letter-spacing:1.5px; color:var(--dim); margin-top:1px; }
.cell.stale .v { color:var(--faint); }
.empty { font-size:11.5px; color:var(--faint); font-style:italic; line-height:1.5; }
kbd { border:1px solid var(--line2); border-bottom-width:2px; border-radius:3px; padding:0 4px;
  font-size:10px; color:var(--dim); font-family:inherit; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">DECK BROWSER</span>
    <span class="ctx" id="ctx"></span>
    <span class="spacer"></span>
    <input class="search" type="search" id="q" placeholder="🔍 deck, OS or card…" />
    <button class="btn" id="pinbtn" title="Pin this deck, then pick another to compare">COMPARE</button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="body">
    <nav class="rail" id="rail"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var decks = D.decks;
  var stale = !!(D.stats && D.stats.stale);
  var sel = decks.length ? decks[0].id : null;
  var pin = null;
  var query = '';

  var byId = {};
  decks.forEach(function (d) { byId[d.id] = d; });

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var pct = function (v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; };
  var num = function (v, dp) { return v == null ? '—' : Number(v).toFixed(dp == null ? 1 : dp); };

  // A deck matches the box if its name, OS or ANY card in it does — searching for a card and
  // finding the decks that run it is half of what this tool is for.
  function matches(d) {
    if (!query) return true;
    var q = query.toLowerCase();
    if (d.speciesName.toLowerCase().indexOf(q) >= 0) return true;
    if (d.id.toLowerCase().indexOf(q) >= 0) return true;
    if (d.os.name.toLowerCase().indexOf(q) >= 0) return true;
    return d.cards.some(function (c) {
      return c.name.toLowerCase().indexOf(q) >= 0 || c.id.toLowerCase().indexOf(q) >= 0;
    });
  }

  function banner() {
    var el = document.getElementById('banner');
    if (!D.stats) {
      el.className = 'banner';
      el.innerHTML = 'Deck lists, card text and firmware are read live from the registry — this page '
        + 'is current as of generation. <b>No balance report found</b>, so there are no win rates: run '
        + '<code>npm run balance:deck</code> to produce <code>docs/balance/deck_report.json</code>, then '
        + 'regenerate.';
      return;
    }
    if (stale) {
      el.className = 'banner stale';
      el.innerHTML = '⚠ <b>The win rates on this page are STALE.</b> They were measured against registry '
        + '<code>' + esc(D.stats.registryHash) + '</code> on ' + esc(D.stats.generatedAt.slice(0, 10))
        + '; the registry is now <code>' + esc(D.registryHash) + '</code>, so a card or species '
        + 'definition has changed since. Deck lists, costs, card text and firmware below are LIVE and '
        + 'correct. Re-run <code>npm run balance:deck</code> to refresh the numbers.';
    } else {
      el.className = 'banner fresh';
      el.innerHTML = '✓ Win rates measured against this exact registry (<code>' + esc(D.registryHash)
        + '</code>) on ' + esc(D.stats.generatedAt.slice(0, 10)) + '. Everything on this page is current.';
    }
  }

  function rail() {
    var list = decks.filter(matches);
    var html = '';
    var group = null;
    list.forEach(function (d) {
      var g = d.launch ? d.element.toUpperCase() : 'NOT TUNED';
      if (g !== group) { group = g; html += '<div class="rail-group">' + esc(g) + '</div>'; }
      var wr = d.summary && d.summary.winRate != null ? pct(d.summary.winRate) : '';
      html += '<button class="rail-item ' + (d.id === sel ? 'sel ' : '') + (d.id === pin ? 'pin ' : '')
        + (d.launch ? '' : 'untuned ') + '" style="--el:var(--' + esc(d.element) + ')" data-id="'
        + esc(d.id) + '">'
        + '<span class="dot">' + esc(d.speciesName.charAt(0)) + '</span>'
        + '<span class="rail-txt"><span class="rail-nm">' + esc(d.speciesName) + '</span>'
        + '<span class="rail-os">' + esc(d.os.name) + '</span></span>'
        + (wr ? '<span class="rail-wr' + (stale ? ' stale' : '') + '">' + wr + '</span>' : '')
        + '</button>';
    });
    if (!list.length) html = '<div class="rail-group">nothing matches “' + esc(query) + '”</div>';
    document.getElementById('rail').innerHTML = html;
  }

  function curveOf(d) {
    var max = Math.max.apply(null, d.curve.concat([1]));
    return '<div class="curve" style="--el:var(--' + esc(d.element) + ')">'
      + d.curve.map(function (n, i) {
        return '<span class="bar' + (n === 0 ? ' zero' : '') + '"><span>' + n + '</span>'
          + '<span class="track"><i style="height:' + Math.max(4, Math.round((n / max) * 100)) + '%"></i></span>'
          + '<span>' + (i === d.curve.length - 1 ? i + '+' : i) + '⚡</span></span>';
      }).join('') + '</div>';
  }

  var SUMMARY_CELLS = [
    ['winRate', 'WIN RATE', pct], ['decisiveWinRate', 'DECISIVE', pct],
    ['averageTurns', 'AVG TURNS', function (v) { return num(v, 2); }],
    ['avgDamagePerTurnDealt', 'DMG / TURN', function (v) { return num(v, 1); }],
    ['avgDamagePerTurnTaken', 'TAKEN / TURN', function (v) { return num(v, 1); }],
    ['deadCardRatio', 'DEAD IN HAND', pct],
    ['avgStatusApplicationsPerGame', 'STATUS / GAME', function (v) { return num(v, 1); }],
    ['ftkRate', 'FIRST-TURN KILL', pct]
  ];

  function panel(d) {
    var h = '<section class="deck" style="--el:var(--' + esc(d.element) + ')">';
    h += '<div class="deck-head"><span class="bigdot">' + esc(d.speciesName.charAt(0)) + '</span>'
      + '<div><h1>' + esc(d.speciesName) + '</h1>'
      + '<div class="sub">' + esc(d.id) + '</div></div>'
      + '<span class="tag el">' + esc(d.element) + (d.secondaryElement ? ' / ' + esc(d.secondaryElement) : '')
      + '</span>'
      + (d.launch ? '' : '<span class="tag warn">NOT TUNED</span>')
      + '</div>';

    h += '<div class="statline"><span><b>' + d.deckSize + '</b> cards</span>'
      + '<span>HP <b>' + (d.baseStats.hp != null ? d.baseStats.hp : '—') + '</b></span>'
      + '<span>ATK <b>' + (d.baseStats.attack != null ? d.baseStats.attack : '—') + '</b></span>'
      + '<span>DEF <b>' + (d.baseStats.defense != null ? d.baseStats.defense : '—') + '</b></span>'
      + '<span>Energy <b>' + (d.baseStats.energy != null ? d.baseStats.energy : '—') + '</b></span>'
      + '<span>Draw <b>' + d.cardDraw + '</b></span></div>';

    h += '<h2>FIRMWARE</h2><div class="os"><div class="os-nm">' + esc(d.os.name) + '</div>'
      + '<div class="os-desc">' + esc(d.os.description) + '</div>'
      + (d.archetypeSummary ? '<div class="archetype">' + esc(d.archetypeSummary) + '</div>' : '')
      + '</div>';

    h += '<h2>COST CURVE</h2>' + curveOf(d);

    h += '<h2>DECK' + (d.engine.length ? ' — engine first (payoff, then its four enablers)' : '') + '</h2>';
    h += '<div class="cards">' + d.cards.map(function (c) {
      var tel = '';
      if (c.playRate != null || c.deadRate != null) {
        var bits = [];
        if (c.playRate != null) bits.push('played ' + pct(c.playRate));
        if (c.deadRate != null) {
          bits.push('<span class="' + (c.deadRate > 0.5 ? 'bad' : '') + '">dead in hand '
            + pct(c.deadRate) + '</span>');
        }
        if (c.avgDamagePerPlay) bits.push('avg dmg ' + num(c.avgDamagePerPlay, 1));
        tel = '<div class="card-tel' + (stale ? ' stale' : '') + '">'
          + bits.join(' · ') + (stale ? ' — stale' : '') + '</div>';
      }
      return '<div class="card ' + (c.engineRole === 'payoff' ? 'payoff' : '')
        + '" style="--el:var(--' + esc(c.element) + ')">'
        + '<span class="gem">' + c.cost + '</span>'
        + '<div class="card-body"><div class="card-top">'
        + '<span class="card-nm">' + esc(c.name) + '</span>'
        + (c.count > 1 ? '<span class="xn">×' + c.count + '</span>' : '')
        + (c.engineRole ? '<span class="role ' + c.engineRole + '">' + c.engineRole.toUpperCase() + '</span>' : '')
        + '<span class="type">' + esc(c.category) + ' · ' + esc(c.rarity) + '</span>'
        + '</div><div class="card-desc">' + esc(c.description) + '</div>' + tel + '</div></div>';
    }).join('') + '</div>';

    h += '<h2>MEASURED' + (stale ? ' — STALE, see the banner' : '') + '</h2>';
    if (d.summary) {
      h += '<div class="grid">' + SUMMARY_CELLS.map(function (row) {
        var v = d.summary[row[0]];
        return '<div class="cell' + (stale ? ' stale' : '') + '"><div class="v">'
          + (v == null ? '—' : row[2](v)) + '</div><div class="k">' + row[1] + '</div></div>';
      }).join('') + '</div>';
    } else {
      h += '<p class="empty">No measurements for this deck. '
        + (d.launch ? 'Run <b>npm run balance:deck</b> to produce them.'
          : 'Untuned species are outside the balance corpus.') + '</p>';
    }
    return h + '</section>';
  }

  function render() {
    banner();
    rail();
    var main = document.getElementById('main');
    var ids = pin && pin !== sel ? [pin, sel] : [sel];
    main.className = 'main' + (ids.length > 1 ? ' split' : '');
    main.innerHTML = ids.map(function (id) { return byId[id] ? panel(byId[id]) : ''; }).join('');
    document.getElementById('pinbtn').className = 'btn' + (pin ? ' on' : '');
    document.getElementById('pinbtn').textContent = pin
      ? 'COMPARING vs ' + byId[pin].speciesName.toUpperCase() : 'COMPARE';
    var d = byId[sel];
    document.getElementById('ctx').textContent = decks.length + ' DECKS · REGISTRY '
      + D.registryHash + (d ? ' · ' + d.id.toUpperCase() : '');
  }

  document.getElementById('rail').addEventListener('click', function (e) {
    var item = e.target.closest('.rail-item');
    if (item) { sel = item.dataset.id; render(); }
  });
  document.getElementById('pinbtn').addEventListener('click', function () {
    pin = pin ? null : sel; render();
  });
  document.getElementById('q').addEventListener('input', function (e) {
    query = e.target.value;
    var visible = decks.filter(matches);
    // Keep the selection legal: a filter that hid the open deck would leave the page showing
    // something the rail no longer offers.
    if (visible.length && visible.indexOf(byId[sel]) < 0) sel = visible[0].id;
    render();
  });

  // j/k and the arrows walk the FILTERED list, so searching then arrowing stays inside the results.
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
    var list = decks.filter(matches);
    var at = list.map(function (d) { return d.id; }).indexOf(sel);
    if (e.key === 'j' || e.key === 'ArrowDown') { sel = list[Math.min(at + 1, list.length - 1)].id; render(); e.preventDefault(); }
    else if (e.key === 'k' || e.key === 'ArrowUp') { sel = list[Math.max(at - 1, 0)].id; render(); e.preventDefault(); }
    else if (e.key === 'c') { pin = pin ? null : sel; render(); }
    else if (e.key === '/') { document.getElementById('q').focus(); e.preventDefault(); }
  });

  render();
})();
</script>
</body>
</html>
