name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Change this to your active dev branch if needed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Ticket 03: the full gate (typecheck, tests, lint, build + assert-no-debug) runs BEFORE
  # anything is published, and `build_site` needs it. A red test therefore blocks the deploy
  # instead of shipping past it. Defined once in ci.yml and called from here rather than
  # duplicated, so the two can never drift apart.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build_site:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # `npm ci` installs exactly the lockfile, so the artifact that ships is built from the
      # same dependency tree the gate above just tested.
      - name: Install dependencies
        run: npm ci

      # Ticket 181a: the label the main menu, Settings and exported run logs show, next to the
      # commit (`vite.config.ts` reads both). It is set HERE, so no GitHub setting is needed: bump
      # the literal below (e.g. to `PLAYTEST 2.1` for a hotfix) in the commit that ships the build.
      # A repository variable named PLAYTEST_LABEL, if one exists, overrides it without a commit.
      #
      # Ticket 181c: the pre-filled feedback form behind "Tell Henry how it went", same pattern as
      # the label. The literal is the form's link template with its five placeholders; a repository
      # variable FEEDBACK_FORM_URL overrides it. It ends up in the public bundle either way, so a
      # variable would not keep it private. Unset (a local build), the buttons do not render.
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_LABEL: ${{ vars.PLAYTEST_LABEL || 'PLAYTEST 2' }}
          VITE_FEEDBACK_FORM_URL: ${{ vars.FEEDBACK_FORM_URL || 'https://docs.google.com/forms/d/e/1FAIpQLSfvGC1R9ZI6xhuUW1E2gCW9f_3moH2Iys9wnVlB9lzPWpB-1A/viewform?usp=pp_url&entry.266049503={build}&entry.1050293904={starter}&entry.563433886={reached}&entry.1982475832={run}&entry.219225348={minutes}' }}

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the output directory of your build command (usually 'dist' for Vite)
          path: 'dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
