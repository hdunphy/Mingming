name: Deploy to GitHub Pages

# Ticket 181: testers only get a new build when Henry pushes to `playtest` on purpose.
# This used to publish every push to `main`, which meant merging WAS releasing and every later merge
# silently changed what the testers were playing. `main` still runs the full gate (ci.yml) on every
# push; it just no longer publishes.
on:
  push:
    branches: [ playtest ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Ticket 03: the full gate (typecheck, tests, lint, build + assert-no-debug) runs BEFORE
  # anything is published, and `build_site` needs it. A red test therefore blocks the deploy
  # instead of shipping past it. Defined once in ci.yml and called from here rather than
  # duplicated, so the two can never drift apart.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build_site:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # `npm ci` installs exactly the lockfile, so the artifact that ships is built from the
      # same dependency tree the gate above just tested.
      - name: Install dependencies
        run: npm ci

      # Ticket 181a: the label the main menu, Settings and exported run logs show, next to the
      # commit (`vite.config.ts` reads both). It comes from the repository variable PLAYTEST_LABEL
      # (GitHub -> Settings -> Secrets and variables -> Actions -> Variables) and falls back to
      # `PLAYTEST` when the variable is not set.
      - name: Build
        run: npm run build
        env:
          VITE_BUILD_LABEL: ${{ vars.PLAYTEST_LABEL || 'PLAYTEST' }}

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the output directory of your build command (usually 'dist' for Vite)
          path: 'dist/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
