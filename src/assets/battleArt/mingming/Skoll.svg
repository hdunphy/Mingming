    <path d="M112 130 Q132 136 148 132" fill="none" stroke-width="4"/>
    <!-- hind legs trailing -->
    <path d="M52 152 Q38 162 24 178" fill="none" stroke-width="4"/>
    <path d="M66 158 Q56 170 46 182" fill="none" stroke-width="4"/>
    <!-- bushy tail -->
    <path d="M30 152 Q12 142 8 124 Q26 130 38 142 Z"/>
