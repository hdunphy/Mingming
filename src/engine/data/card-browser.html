<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Program Library</title>
<style>
  :root{
    --el-fire:#ff3333; --el-water:#3399ff; --el-nature:#33cc33; --el-earth:#996633;
    --el-air:#87ceeb; --el-ice:#00ffff; --el-light:#ffff80; --el-dark:#8000ff; --el-none:#8a8a99;

    --surface-0:#0b0d11; --surface-1:#12161c; --surface-2:#171d25; --surface-3:#1f2731;
    --line-soft:#1e242c; --line:#2a2f38; --line-strong:#3b4553;
    --ink:#dfe4ea; --ink-dim:#c6ccd4; --ink-label:#7d8ea1; --ink-faint:#5f6b7a; --ink-head:#9fb4c8;
    --accent:#22d3ee;
    --exhaust:#ff9944; --token:#8888ff; --daemon:#00d2ff;
    --rare:#e8c874; --uncommon:#7fd6ff; --common:#9aa3ad;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% 0%, #171b2e 0%, var(--surface-0) 60%);
    color: var(--ink);
    font-family: 'Outfit','Inter',system-ui,Avenir,Helvetica,Arial,sans-serif;
    min-height: 100vh;
  }

  /* ---------- header / controls ---------- */
  header{
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,13,17,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 18px 28px 14px;
  }
  .titlebar{ display:flex; align-items:baseline; justify-content:space-between; gap: 16px; flex-wrap:wrap; margin-bottom:14px; }
  h1{
    margin:0; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: var(--ink-head);
    display:flex; align-items:center; gap:10px;
  }
  h1 .glyph{ color: var(--accent); text-shadow: 0 0 12px rgba(34,211,238,0.6); }
  .count{ font-size: 13px; color: var(--ink-label); font-variant-numeric: tabular-nums; }
  .count b{ color: var(--ink); font-weight:700; }

  .controls-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 12px; }
  .search-wrap{ position:relative; flex: 1 1 260px; min-width: 220px; }
  .search-wrap input{
    width:100%; padding: 9px 14px 9px 34px; background: var(--surface-1);
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font-size: 13.5px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,211,238,0.15); }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.55; pointer-events:none; }

  select#sortSelect{
    background: var(--surface-1); border:1px solid var(--line); color: var(--ink);
    padding: 9px 12px; border-radius: 8px; font-size: 13px; cursor:pointer; outline:none;
  }
  .btn{
    background: var(--surface-1); border:1px solid var(--line); color: var(--ink-dim);
    padding: 9px 14px; border-radius: 8px; font-size: 13px; cursor:pointer; white-space:nowrap;
    transition: border-color .15s, color .15s;
  }
  .btn:hover{ border-color: var(--line-strong); color: var(--ink); }
  .btn.file-btn{ position:relative; overflow:hidden; }
  .btn.file-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  .filter-groups{ display:flex; gap: 22px; flex-wrap:wrap; align-items:flex-start; }
  .filter-group{ display:flex; flex-direction:column; gap:6px; }
  .filter-group .fg-label{
    font-size: 10px; letter-spacing: 0.12em; text-transform:uppercase; color: var(--ink-faint); font-weight:600;
  }
  .chips{ display:flex; gap:6px; flex-wrap:wrap; max-width: 520px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px;
    padding: 5px 10px; border-radius: 100px; font-size: 12px; font-weight:600;
    border: 1px solid var(--line); background: var(--surface-1); color: var(--ink-dim);
    cursor:pointer; user-select:none; transition: all .12s;
  }
  .chip:hover{ border-color: var(--line-strong); }
  .chip .dot{ width:8px; height:8px; border-radius:50%; background: currentColor; }
  .chip.active{ background: var(--chip-color, var(--accent)); color: #0b0d11; border-color: transparent; }
  .chip.active .dot{ background: #0b0d11; }

  .clear-link{ font-size:12px; color: var(--ink-faint); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
  .clear-link:hover{ color: var(--ink-dim); }

  /* ---------- grid ---------- */
  main{ padding: 20px 28px 60px; max-width: 1600px; margin: 0 auto; }
  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
  }

  .card{
    position:relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)), var(--surface-2);
    border: 1px solid var(--card-border, var(--line));
    border-radius: 10px;
    padding: 14px 14px 12px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    display:flex; flex-direction:column; gap:8px;
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--card-accent, var(--line-strong));
    box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 0 0 1px var(--card-accent, transparent);
  }

  .card-top{ display:flex; align-items:center; justify-content:space-between; }
  .cost-badge{
    font-weight:800; font-size: 13px; padding: 3px 9px; border-radius:5px;
    background: var(--badge-bg); color: var(--badge-text); text-shadow: var(--badge-shadow, none);
  }
  .el-icon{ font-size: 17px; color: var(--card-accent); }

  .card-name{ font-weight:700; font-size: 14.5px; color: #f2f5fa; line-height:1.25; min-height: 2.3em; }

  .card-meta{
    display:flex; align-items:center; gap:6px; font-size: 11px; font-weight:600;
    letter-spacing: 0.04em; color: var(--ink-label);
  }
  .card-meta .rarity{ margin-left:auto; font-size:10px; letter-spacing:0.08em; font-weight:700; text-transform:uppercase; }

  .kw-row{ display:flex; flex-wrap:wrap; gap:4px; }
  .kw-chip{
    font-size: 9.5px; font-weight:800; letter-spacing:0.04em; padding: 2px 6px; border-radius:4px;
    border: 1px solid currentColor; background: rgba(0,0,0,0.35);
  }

  .card-desc{
    font-size: 12px; line-height:1.45; color: var(--ink-dim); flex: 1;
  }

  .card-footer{ display:flex; justify-content:space-between; align-items:center; font-size:10px; color: var(--ink-faint); font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .empty-state{
    text-align:center; padding: 80px 20px; color: var(--ink-label);
  }
  .empty-state h2{ color: var(--ink-head); font-size:18px; margin-bottom:8px; }
  .empty-state p{ font-size: 13px; max-width: 480px; margin: 0 auto 18px; line-height:1.6; }

  /* drag overlay */
  #dropOverlay{
    position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
    background: rgba(11,13,17,0.85); backdrop-filter: blur(4px);
    border: 3px dashed var(--accent); margin: 14px;
  }
  #dropOverlay.show{ display:flex; }
  #dropOverlay span{ font-size: 20px; color: var(--accent); font-weight:700; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(5,5,8,0.72); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index: 50; padding: 24px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background: var(--surface-1); border:1px solid var(--line-strong); border-radius: 14px;
    max-width: 480px; width:100%; max-height: 84vh; overflow-y:auto; padding: 22px 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    border-top: 3px solid var(--m-accent, var(--accent));
  }
  .modal-close{
    float:right; background:none; border:none; color: var(--ink-faint); font-size:20px; cursor:pointer; line-height:1;
  }
  .modal h2{ margin: 0 0 4px; font-size: 19px; color:#f2f5fa; }
  .modal .modal-sub{ font-size:12px; color: var(--ink-label); margin-bottom:14px; font-family: ui-monospace, monospace; }
  .modal .modal-desc{ font-size: 13.5px; line-height:1.6; color: var(--ink-dim); margin-bottom: 16px; }
  .modal-section{ margin-bottom: 14px; }
  .modal-section h3{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color: var(--ink-faint); margin: 0 0 6px; }
  .action-line{
    font-size: 12px; font-family: ui-monospace, 'JetBrains Mono', monospace; color: var(--ink-dim);
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius:6px;
    padding: 6px 10px; margin-bottom:4px;
  }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{ font-size:11px; padding:3px 8px; border-radius:5px; background: var(--surface-2); border:1px solid var(--line); color: var(--ink-label); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1><span class="glyph">◈</span> Program Library</h1>
    <div class="count" id="countLabel">loading…</div>
  </div>

  <div class="controls-row">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search name, id, description, hooks…" autocomplete="off" />
    </div>
    <select id="sortSelect">
      <option value="name">Sort: Name A–Z</option>
      <option value="cost-asc">Sort: Cost (low→high)</option>
      <option value="cost-desc">Sort: Cost (high→low)</option>
      <option value="element">Sort: Element</option>
      <option value="category">Sort: Category</option>
      <option value="rarity">Sort: Rarity</option>
    </select>
    <button class="btn file-btn">Load programs.json
      <input type="file" id="fileInput" accept=".json,application/json" />
    </button>
    <button class="clear-link" id="clearFilters">Clear all filters</button>
  </div>

  <div class="filter-groups">
    <div class="filter-group">
      <span class="fg-label">Element</span>
      <div class="chips" id="elementChips"></div>
    </div>
    <div class="filter-group">
      <span class="fg-label">Category</span>
      <div class="chips" id="categoryChips"></div>
    </div>
    <div class="filter-group">
      <span class="fg-label">Rarity</span>
      <div class="chips" id="rarityChips"></div>
    </div>
    <div class="filter-group">
      <span class="fg-label">Target</span>
      <div class="chips" id="targetChips"></div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;"></div>
</main>

<div id="dropOverlay"><span>Drop programs.json to load it</span></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ============================================================
 * Element palette — mirrors the game's ProgramCard.tsx / contrastText.ts.
 * ============================================================ */
const ELEMENT_HEX = {
  Fire:'#ff3333', Water:'#3399ff', Nature:'#33cc33', Earth:'#996633',
  Air:'#87ceeb', Ice:'#00ffff', Light:'#ffff80', Dark:'#8000ff', None:'#8a8a99'
};
const ELEMENT_ICON = { Fire:'🔥', Water:'💧', Nature:'🌿', Earth:'⛰️', Air:'💨', Ice:'❄️', Light:'✨', Dark:'🌑', None:'∅' };
const CATEGORY_ICON = { Attack:'⚔️', Skill:'⚙️', Daemon:'👾', Heal:'💚', Status:'🧪', Special:'🌟' };
const KEYWORD_INFO = {
  EXHAUST: { label:'EXHAUST', color:'#ff9944' },
  TOKEN:   { label:'TOKEN',   color:'#8888ff' },
  DAEMON:  { label:'DAEMON',  color:'#00d2ff' }
};
const RARITY_COLOR = { Common:'#9aa3ad', Uncommon:'#7fd6ff', Rare:'#e8c874', Token:'#8888ff' };

const DARK_TEXT = '#0b0e14', LIGHT_TEXT = '#ffffff';
function parseHex(hex){ let h=hex.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function toHex([r,g,b]){ const c=v=>Math.round(Math.min(255,Math.max(0,v))).toString(16).padStart(2,'0'); return `#${c(r)}${c(g)}${c(b)}`; }
function channel(v){ const s=v/255; return s<=0.04045? s/12.92 : Math.pow((s+0.055)/1.055,2.4); }
function relLum(hex){ const [r,g,b]=parseHex(hex); return 0.2126*channel(r)+0.7152*channel(g)+0.0722*channel(b); }
function contrastRatio(a,b){ const la=relLum(a), lb=relLum(b); const [hi,lo]= la>=lb?[la,lb]:[lb,la]; return (hi+0.05)/(lo+0.05); }
function mixHex(hex,toward,amount){ const a=parseHex(hex), b=parseHex(toward); return toHex([a[0]+(b[0]-a[0])*amount,a[1]+(b[1]-a[1])*amount,a[2]+(b[2]-a[2])*amount]); }
function readableTextOn(bg){ return relLum(bg) > 0.36 ? DARK_TEXT : LIGHT_TEXT; }
function badgeBgFor(hex){ const text=readableTextOn(hex); let bg=hex; for(let i=0;i<12 && contrastRatio(text,bg)<4.5;i++) bg=mixHex(bg,'#000000',0.12); return bg; }
function accentOnDarkFor(hex){ let c=hex; for(let i=0;i<12 && contrastRatio(c,'#0d0d14')<4.5;i++) c=mixHex(c,'#ffffff',0.15); return c; }
function badgeShadow(t){ return t===LIGHT_TEXT ? '0 1px 2px rgba(0,0,0,0.65)' : 'none'; }

const ELEMENT_TEXT={}, ELEMENT_BADGE_BG={}, ELEMENT_ACCENT={};
for(const el of Object.keys(ELEMENT_HEX)){
  const hex = ELEMENT_HEX[el];
  ELEMENT_TEXT[el] = readableTextOn(hex);
  ELEMENT_BADGE_BG[el] = badgeBgFor(hex);
  ELEMENT_ACCENT[el] = accentOnDarkFor(hex);
}
function elHex(el){ return ELEMENT_HEX[el] ?? ELEMENT_HEX.None; }

/* ============================================================
 * State
 * ============================================================ */
let ALL_CARDS = [];
const state = {
  search: '',
  sort: 'name',
  elements: new Set(),
  categories: new Set(),
  rarities: new Set(),
  targets: new Set(),
};

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
 * Loading data
 * ============================================================ */
async function tryAutoLoad(){
  const candidates = ['./programs.json', 'programs.json', '/src/engine/data/programs.json'];
  for(const path of candidates){
    try{
      const res = await fetch(path, { cache: 'no-store' });
      if(res.ok){
        const json = await res.json();
        loadData(json, path);
        return;
      }
    }catch(e){ /* try next */ }
  }
  showEmpty(
    'Point me at programs.json',
    'This page ships without a bundled copy so it always reflects your current file. Drop <code>programs.json</code> anywhere on this page, or use the "Load programs.json" button above — nothing leaves your machine, it\'s read straight into the browser.'
  );
}

function loadData(json, sourceLabel){
  ALL_CARDS = Object.values(json).map(c => ({ ...c }));
  document.title = `Program Library (${ALL_CARDS.length})`;
  buildFilterChips();
  render();
}

function showEmpty(title, html){
  document.getElementById('grid').style.display='none';
  const el = document.getElementById('emptyState');
  el.style.display='block';
  el.innerHTML = `<h2>${title}</h2><p>${html}</p>`;
  document.getElementById('countLabel').textContent = 'no data loaded';
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{ loadData(JSON.parse(reader.result), file.name); }
    catch(err){ alert('Could not parse that file as JSON: ' + err.message); }
  };
  reader.readAsText(file);
});

const dropOverlay = document.getElementById('dropOverlay');
let dragDepth = 0;
window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; dropOverlay.classList.add('show'); });
window.addEventListener('dragleave', e => { e.preventDefault(); dragDepth--; if(dragDepth<=0){ dragDepth=0; dropOverlay.classList.remove('show'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropOverlay.classList.remove('show');
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{ loadData(JSON.parse(reader.result), file.name); }
    catch(err){ alert('Could not parse that file as JSON: ' + err.message); }
  };
  reader.readAsText(file);
});

/* ============================================================
 * Filter chip construction
 * ============================================================ */
function buildFilterChips(){
  const elements = [...new Set(ALL_CARDS.map(c => c.element))].sort();
  const categories = [...new Set(ALL_CARDS.map(c => c.category))].sort();
  const rarities = ['Common','Uncommon','Rare','Token'].filter(r => ALL_CARDS.some(c => c.rarity === r));
  const targets = [...new Set(ALL_CARDS.map(c => c.target))].sort();

  fillChipGroup('elementChips', elements, state.elements, el => ({
    label: `${ELEMENT_ICON[el] ?? '◈'} ${el}`, color: ELEMENT_ACCENT[el] ?? elHex(el)
  }));
  fillChipGroup('categoryChips', categories, state.categories, cat => ({
    label: `${CATEGORY_ICON[cat] ?? '◈'} ${cat}`, color: '#7fd6ff'
  }));
  fillChipGroup('rarityChips', rarities, state.rarities, r => ({ label: r, color: RARITY_COLOR[r] }));
  fillChipGroup('targetChips', targets, state.targets, t => ({ label: t, color: '#9fb4c8' }));
}

function fillChipGroup(containerId, values, selectedSet, styleFn){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  for(const v of values){
    const { label, color } = styleFn(v);
    const chip = document.createElement('button');
    chip.className = 'chip' + (selectedSet.has(v) ? ' active' : '');
    chip.style.setProperty('--chip-color', color);
    chip.style.color = selectedSet.has(v) ? '#0b0d11' : color;
    chip.innerHTML = `<span>${label}</span>`;
    chip.addEventListener('click', () => {
      if(selectedSet.has(v)) selectedSet.delete(v); else selectedSet.add(v);
      buildFilterChips();
      render();
    });
    container.appendChild(chip);
  }
}

document.getElementById('clearFilters').addEventListener('click', () => {
  state.elements.clear(); state.categories.clear(); state.rarities.clear(); state.targets.clear();
  state.search = ''; document.getElementById('searchInput').value = '';
  buildFilterChips(); render();
});

document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; render(); });

/* ============================================================
 * Filtering + sorting + rendering
 * ============================================================ */
const RARITY_ORDER = { Token:0, Common:1, Uncommon:2, Rare:3 };

function getFiltered(){
  let list = ALL_CARDS.filter(c => {
    if(state.elements.size && !state.elements.has(c.element)) return false;
    if(state.categories.size && !state.categories.has(c.category)) return false;
    if(state.rarities.size && !state.rarities.has(c.rarity)) return false;
    if(state.targets.size && !state.targets.has(c.target)) return false;
    if(state.search){
      const hay = [c.id, c.name, c.description, c.element, c.category, c.rarity, ...(c.hooks||[])].join(' ').toLowerCase();
      if(!hay.includes(state.search)) return false;
    }
    return true;
  });

  list.sort((a,b) => {
    switch(state.sort){
      case 'cost-asc': return a.baseCost - b.baseCost || a.name.localeCompare(b.name);
      case 'cost-desc': return b.baseCost - a.baseCost || a.name.localeCompare(b.name);
      case 'element': return a.element.localeCompare(b.element) || a.name.localeCompare(b.name);
      case 'category': return a.category.localeCompare(b.category) || a.name.localeCompare(b.name);
      case 'rarity': return (RARITY_ORDER[a.rarity]??0) - (RARITY_ORDER[b.rarity]??0) || a.name.localeCompare(b.name);
      default: return a.name.localeCompare(b.name);
    }
  });
  return list;
}

function cardKeywords(c){
  const kws = [];
  if(c.category === 'Daemon') kws.push('DAEMON');
  if(c.exhaust) kws.push('EXHAUST');
  if(c.isToken) kws.push('TOKEN');
  return kws;
}

function renderCard(c){
  const accent = ELEMENT_ACCENT[c.element] ?? elHex(c.element);
  const badgeBg = ELEMENT_BADGE_BG[c.element] ?? '#8a8a99';
  const badgeText = ELEMENT_TEXT[c.element] ?? DARK_TEXT;
  const kws = cardKeywords(c);
  const kwHtml = kws.map(k => `<span class="kw-chip" style="color:${KEYWORD_INFO[k].color}">${KEYWORD_INFO[k].label}</span>`).join('');

  const div = document.createElement('div');
  div.className = 'card';
  div.style.setProperty('--card-accent', accent);
  div.style.setProperty('--card-border', `${elHex(c.element)}44`);
  div.innerHTML = `
    <div class="card-top">
      <span class="cost-badge" style="--badge-bg:${badgeBg};--badge-text:${badgeText};--badge-shadow:${badgeShadow(badgeText)};background:var(--badge-bg);color:var(--badge-text);">${c.baseCost}⚡</span>
      <span class="el-icon">${ELEMENT_ICON[c.element] ?? '◈'}</span>
    </div>
    <div class="card-name">${esc(c.name)}</div>
    <div class="card-meta">
      <span>${CATEGORY_ICON[c.category] ?? '◈'}</span><span>${esc(c.category).toUpperCase()}</span>
      <span class="rarity" style="color:${RARITY_COLOR[c.rarity] ?? '#9aa3ad'}">${esc(c.rarity)}</span>
    </div>
    ${kwHtml ? `<div class="kw-row">${kwHtml}</div>` : ''}
    <div class="card-desc">${esc(c.description)}</div>
    <div class="card-footer"><span>${esc(c.target)}</span><span>${esc(c.id)}</span></div>
  `;
  div.addEventListener('click', () => openModal(c));
  return div;
}

function render(){
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  document.getElementById('countLabel').innerHTML = `<b>${list.length}</b> of <b>${ALL_CARDS.length}</b> programs`;

  if(ALL_CARDS.length === 0) return;

  if(list.length === 0){
    grid.style.display = 'none';
    empty.style.display = 'block';
    empty.innerHTML = `<h2>No matches</h2><p>Nothing fits the current search and filters. <button class="clear-link" onclick="document.getElementById('clearFilters').click()">Clear them</button> and try again.</p>`;
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(const c of list) frag.appendChild(renderCard(c));
  grid.appendChild(frag);
}

/* ============================================================
 * Detail modal
 * ============================================================ */
function describeAction(a){
  const rest = Object.entries(a).filter(([k]) => k !== 'type')
    .map(([k,v]) => `${k}=${Array.isArray(v)||typeof v==='object' ? JSON.stringify(v) : v}`).join('  ');
  return `${a.type}${rest ? '  ·  ' + rest : ''}`;
}

function openModal(c){
  const accent = ELEMENT_ACCENT[c.element] ?? elHex(c.element);
  const badgeBg = ELEMENT_BADGE_BG[c.element] ?? '#8a8a99';
  const badgeText = ELEMENT_TEXT[c.element] ?? DARK_TEXT;
  const kws = cardKeywords(c);
  const modal = document.getElementById('modalBody');
  modal.style.setProperty('--m-accent', accent);
  modal.innerHTML = `
    <button class="modal-close" id="modalCloseBtn">&times;</button>
    <div class="card-top" style="margin-bottom:10px;">
      <span class="cost-badge" style="background:${badgeBg};color:${badgeText};text-shadow:${badgeShadow(badgeText)}">${c.baseCost}⚡</span>
      <span class="el-icon" style="color:${accent}">${ELEMENT_ICON[c.element] ?? '◈'} ${esc(c.element)}</span>
    </div>
    <h2>${esc(c.name)}</h2>
    <div class="modal-sub">${esc(c.id)} &nbsp;·&nbsp; ${esc(c.category)} &nbsp;·&nbsp; ${esc(c.rarity)} &nbsp;·&nbsp; target: ${esc(c.target)}</div>
    ${kws.length ? `<div class="kw-row" style="margin-bottom:12px;">${kws.map(k=>`<span class="kw-chip" style="color:${KEYWORD_INFO[k].color}">${KEYWORD_INFO[k].label}</span>`).join('')}</div>` : ''}
    <div class="modal-desc">${esc(c.description)}</div>
    ${c.actions && c.actions.length ? `
      <div class="modal-section">
        <h3>Actions</h3>
        ${c.actions.map(a => `<div class="action-line">${esc(describeAction(a))}</div>`).join('')}
      </div>` : ''}
    ${c.constraints && c.constraints.length ? `
      <div class="modal-section">
        <h3>Constraints</h3>
        <div class="tag-row">${c.constraints.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      </div>` : ''}
    ${c.hooks && c.hooks.length ? `
      <div class="modal-section">
        <h3>Hooks</h3>
        <div class="tag-row">${c.hooks.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
      </div>` : ''}
    ${c.growPerPlay ? `<div class="modal-section"><h3>Grows per play</h3><div class="action-line">${esc(JSON.stringify(c.growPerPlay))}</div></div>` : ''}
    ${c.discardEffect ? `<div class="modal-section"><h3>Discard effect</h3><div class="action-line">${esc(JSON.stringify(c.discardEffect))}</div></div>` : ''}
  `;
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }
document.getElementById('modalBackdrop').addEventListener('click', e => { if(e.target.id === 'modalBackdrop') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ============================================================
 * Boot
 * ============================================================ */
tryAutoLoad();
</script>
</body>
</html>
